components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JSON Web Token provided via Authorization header
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HTTP-only Access Token cookie

  schemas:
    ApiResponse:
      type: object
      required:
        - statusCode
        - success
        - message
        - data
      properties:
        statusCode:
          type: integer
          example: 200
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true

    ApiErrorResponse:
      type: object
      required:
        - statusCode
        - success
        - message
        - errors
      properties:
        statusCode:
          type: integer
          example: 400
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Something went wrong
        errors:
          type: array
          items:
            type: object
          example: []

  responses:
    UnauthorizedError:
      description: Unauthorized request or invalid / expired access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            statusCode: 401
            success: false
            message: Unauthorized request
            errors: []

    ForbiddenError:
      description: Forbidden - Insufficient role permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            statusCode: 403
            success: false
            message: You do not have permission to perform this action
            errors: []

    ValidationError:
      description: Validation failed on request parameters or body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            statusCode: 400
            success: false
            message: Validation failed
            errors:
              - path: ["email"]
                message: Invalid email address
