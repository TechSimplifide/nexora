openapi: 3.0.3

info:
  title: Nexora API
  version: 1.0.0
  description: |
    Nexora is a Multi-College Academic Project Collaboration Platform.

    This API provides multi-tenant authentication, college management, project proposal submissions and reviews, 
    project repository management, granular resource-level access requests, AI-powered project recommendations,
    real-time notification tracking, and analytical dashboards for students and administrators.

servers:
  - url: http://localhost:3000/api/v1
    description: Local Development Server
  - url: /api/v1
    description: Current Host Relative Base URL

tags:
  - name: Health Check
    description: System status and liveness checks
  - name: Authentication
    description: Authentication, registration, email verification, and session management
  - name: College Management
    description: College registration and multi-tenant setup
  - name: Projects
    description: Project creation, discovery, filtering, updates, deletion, and featuring
  - name: Project Resources
    description: Granular access control for GitHub repositories, live demos, and documentation
  - name: Project Access Requests
    description: Resource-level access request submission, review, and cancellation workflows
  - name: Project Proposals
    description: Academic proposal submission, PDF abstracts, and administrative review workflows
  - name: Recommendations
    description: AI-assisted project idea generation and management using Google Gemini
  - name: Notifications
    description: User notification delivery, read state tracking, and deletion
  - name: Dashboard
    description: Role-specific analytical metrics and summary feeds for students and admins

paths:
  /healthcheck:
    get:
      tags:
        - Health Check
      summary: Health Check
      description: Returns server operational status.
      responses:
        "200":
          description: Server is healthy and running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Success
                data:
                  message: Server is running

  /auth/college/register:
    post:
      tags:
        - College Management
        - Authentication
      summary: Register College and Administrator
      description: >
        Atomically creates a new college tenant and registers its primary administrator account.
        Generates a unique college code and sends a verification link to the administrator's email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collegeName
                - adminName
                - email
                - password
              properties:
                collegeName:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: Institute of Technology & Science
                adminName:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: John Admin
                email:
                  type: string
                  format: email
                  example: admin@college.edu
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 32
                  example: SuperSecret123!
      responses:
        "201":
          description: College and administrator registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                success: true
                message: College registered successfully. Please check your email to verify the account.
                data:
                  collegeCode: INS-K79A2
                  admin:
                    id: 67be01a2b3c4d5e6f7a8b9c0
                    fullName: John Admin
                    email: admin@college.edu
                    role: admin
                    isVerified: false
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: User already exists with this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                statusCode: 409
                success: false
                message: User already exists with this email
                errors: []

  /auth/student/register:
    post:
      tags:
        - Authentication
      summary: Register Student Account
      description: >
        Registers a new student user under an existing college using the corresponding college code.
        Sends an email verification token expiring in 20 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
                - collegeCode
              properties:
                fullName:
                  type: string
                  minLength: 3
                  maxLength: 50
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@student.edu
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 32
                  example: Password123!
                collegeCode:
                  type: string
                  minLength: 5
                  maxLength: 15
                  example: INS-K79A2
      responses:
        "201":
          description: Student registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                success: true
                message: Student registered successfully. Please check your email to verify your account.
                data:
                  id: 67be02a2b3c4d5e6f7a8b9c1
                  fullName: Jane Doe
                  email: jane.doe@student.edu
                  role: student
                  college:
                    id: 67be01a2b3c4d5e6f7a8b9c0
                    name: Institute of Technology & Science
                    collegeCode: INS-K79A2
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Invalid college code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: User already exists with this email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: >
        Authenticates a user using email and password. Returns access token in response body and sets
        httpOnly cookies for both accessToken (1 day) and refreshToken (10 days).
        Requires the user to have a verified email address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: jane.doe@student.edu
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: Password123!
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets accessToken and refreshToken httpOnly cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Login successful
                data:
                  user:
                    id: 67be02a2b3c4d5e6f7a8b9c1
                    fullName: Jane Doe
                    email: jane.doe@student.edu
                    role: student
                    college: 67be01a2b3c4d5e6f7a8b9c0
                  accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "403":
          description: Email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                statusCode: 403
                success: false
                message: Please verify your email first.
                errors: []

  /auth/verify-email/{token}:
    get:
      tags:
        - Authentication
      summary: Verify Email Address
      description: Validates the SHA-256 hashed verification token from the email link and marks user as verified.
      parameters:
        - name: token
          in: path
          required: true
          description: Unhashed token sent via verification email
          schema:
            type: string
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Email verified successfully
                data: {}
        "400":
          description: Invalid or expired verification link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /auth/resend-verification-email:
    post:
      tags:
        - Authentication
      summary: Resend Verification Email
      description: Generates a new 20-minute verification token and resends the verification link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: jane.doe@student.edu
      responses:
        "200":
          description: Verification email sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Verification email sent successfully
                data: {}
        "400":
          description: Email is already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get Current User Profile
      description: Returns the authenticated user's profile and populated college details.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Current user fetched successfully
                data:
                  id: 67be02a2b3c4d5e6f7a8b9c1
                  fullName: Jane Doe
                  email: jane.doe@student.edu
                  role: student
                  isVerified: true
                  avatar:
                    publicId: null
                    url: https://placehold.co/200x200
                  college:
                    id: 67be01a2b3c4d5e6f7a8b9c0
                    name: Institute of Technology & Science
                    collegeCode: INS-K79A2
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout User
      description: Invalidates active refresh token in database and clears authentication cookies.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Clears accessToken and refreshToken cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Logged out successfully
                data: {}
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh Access Token
      description: >
        Rotates and issues new access and refresh tokens using the incoming refreshToken cookie.
      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
            type: string
          description: HTTP-only refresh token cookie
      responses:
        "200":
          description: Access token refreshed successfully
          headers:
            Set-Cookie:
              description: Sets rotated accessToken and refreshToken cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Access token refreshed successfully
                data:
                  user:
                    id: 67be02a2b3c4d5e6f7a8b9c1
                    fullName: Jane Doe
                    email: jane.doe@student.edu
                    role: student
                    college: 67be01a2b3c4d5e6f7a8b9c0
        "401":
          description: Missing, invalid, or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /project-proposals:
    post:
      tags:
        - Project Proposals
      summary: Submit Project Proposal
      description: >
        Submits an academic project proposal with a PDF abstract. Uploads PDF to Cloudinary and notifies
        the college administrator.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - team
                - abstractPdf
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 150
                  example: Autonomous Drone Navigation System
                team:
                  type: string
                  description: JSON string representation of team object with size matching members length
                  example: '{"size":2,"members":[{"name":"Jane Doe"},{"name":"John Smith"}]}'
                abstractPdf:
                  type: string
                  format: binary
                  description: PDF abstract document (Max 5MB)
      responses:
        "201":
          description: Project proposal submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                success: true
                message: Project proposal submitted successfully
                data:
                  _id: 67be03a2b3c4d5e6f7a8b9c2
                  title: Autonomous Drone Navigation System
                  team:
                    size: 2
                    members:
                      - name: Jane Doe
                      - name: John Smith
                  abstractPdf:
                    url: https://res.cloudinary.com/.../abstract.pdf
                    publicId: nexora/project-proposals/abc123
                  createdBy: 67be02a2b3c4d5e6f7a8b9c1
                  college: 67be01a2b3c4d5e6f7a8b9c0
                  status: pending
                  adminRemarks: null
                  reviewedBy: null
                  reviewedAt: null
                  createdAt: "2026-08-27T10:00:00.000Z"
                  updatedAt: "2026-08-27T10:00:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /project-proposals/my:
    get:
      tags:
        - Project Proposals
      summary: Get Student Proposals
      description: Retrieves all project proposals submitted by the authenticated student.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Proposals fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Project proposals fetched successfully
                data:
                  - _id: 67be03a2b3c4d5e6f7a8b9c2
                    title: Autonomous Drone Navigation System
                    team:
                      size: 2
                      members:
                        - name: Jane Doe
                        - name: John Smith
                    abstractPdf:
                      url: https://res.cloudinary.com/.../abstract.pdf
                      publicId: nexora/project-proposals/abc123
                    createdBy: 67be02a2b3c4d5e6f7a8b9c1
                    college:
                      _id: 67be01a2b3c4d5e6f7a8b9c0
                      name: Institute of Technology & Science
                      collegeCode: INS-K79A2
                    status: pending
                    adminRemarks: null
                    reviewedBy: null
                    reviewedAt: null
                    createdAt: "2026-08-27T10:00:00.000Z"
                    updatedAt: "2026-08-27T10:00:00.000Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /project-proposals/pending:
    get:
      tags:
        - Project Proposals
      summary: Get Pending Proposals (Admin)
      description: Retrieves all pending proposals submitted by students within the admin's college.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: Pending proposals fetched successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Pending project proposals fetched successfully
                data:
                  - _id: 67be03a2b3c4d5e6f7a8b9c2
                    title: Autonomous Drone Navigation System
                    team:
                      size: 2
                      members:
                        - name: Jane Doe
                        - name: John Smith
                    abstractPdf:
                      url: https://res.cloudinary.com/.../abstract.pdf
                      publicId: nexora/project-proposals/abc123
                    createdBy:
                      _id: 67be02a2b3c4d5e6f7a8b9c1
                      fullName: Jane Doe
                      email: jane.doe@student.edu
                    college:
                      _id: 67be01a2b3c4d5e6f7a8b9c0
                      name: Institute of Technology & Science
                      collegeCode: INS-K79A2
                    status: pending
                    createdAt: "2026-08-27T10:00:00.000Z"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /project-proposals/{id}/approve:
    patch:
      tags:
        - Project Proposals
      summary: Approve Project Proposal (Admin)
      description: Marks a pending proposal in the admin's college as approved and notifies the submitting student.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Proposal ObjectId
          schema:
            type: string
      responses:
        "200":
          description: Proposal approved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Project proposal approved successfully
                data:
                  _id: 67be03a2b3c4d5e6f7a8b9c2
                  status: approved
                  reviewedBy: 67be01a2b3c4d5e6f7a8b9c0
                  reviewedAt: "2026-08-27T10:15:00.000Z"
                  adminRemarks: null
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Pending project proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /project-proposals/{id}/reject:
    patch:
      tags:
        - Project Proposals
      summary: Reject Project Proposal (Admin)
      description: Rejects a pending proposal with required feedback remarks and notifies the student.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Proposal ObjectId
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - adminRemarks
              properties:
                adminRemarks:
                  type: string
                  minLength: 5
                  maxLength: 800
                  example: Please clarify the dataset collection methodology.
      responses:
        "200":
          description: Proposal rejected successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Project proposal rejected successfully
                data:
                  _id: 67be03a2b3c4d5e6f7a8b9c2
                  status: rejected
                  adminRemarks: Please clarify the dataset collection methodology.
                  reviewedBy: 67be01a2b3c4d5e6f7a8b9c0
                  reviewedAt: "2026-08-27T10:15:00.000Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Pending project proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /project-proposals/{id}:
    patch:
      tags:
        - Project Proposals
      summary: Update & Resubmit Rejected Proposal
      description: >
        Allows a student to update their rejected proposal (title, team, or abstract PDF).
        Resets status to pending and notifies college admin.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Proposal ObjectId
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 5
                  maxLength: 150
                  example: Autonomous Drone Navigation System - Revised
                team:
                  type: string
                  description: Optional JSON string of team
                  example: '{"size":2,"members":[{"name":"Jane Doe"},{"name":"John Smith"}]}'
                abstractPdf:
                  type: string
                  format: binary
                  description: Optional replacement PDF
      responses:
        "200":
          description: Proposal updated and resubmitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Project proposal updated and resubmitted successfully
                data:
                  _id: 67be03a2b3c4d5e6f7a8b9c2
                  status: pending
                  adminRemarks: null
                  reviewedBy: null
                  reviewedAt: null
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Rejected project proposal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

    delete:
      tags:
        - Project Proposals
      summary: Delete Proposal
      description: Deletes a proposal (only allowed if status is pending or rejected) and removes PDF from Cloudinary.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Proposal ObjectId
          schema:
            type: string
      responses:
        "200":
          description: Proposal deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 200
                success: true
                message: Project proposal deleted successfully
                data:
                  id: 67be03a2b3c4d5e6f7a8b9c2
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          description: Project proposal not found or cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /projects:
    post:
      tags:
        - Projects
      summary: Create Project
      description: >
        Creates a completed academic project under the student's college with screenshots, supporting PDF,
        and configurable access levels for GitHub repository and deployed demo URL.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - summary
                - description
                - technologies
                - domain
                - department
                - academicYear
                - teamMembers
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 100
                  example: AI-Driven Crop Disease Detection
                summary:
                  type: string
                  minLength: 20
                  maxLength: 500
                  example: Deep learning platform for identifying plant leaf diseases in real-time.
                description:
                  type: string
                  minLength: 50
                  maxLength: 5000
                  example: Comprehensive agricultural support system using Convolutional Neural Networks...
                technologies:
                  type: string
                  description: JSON array string of technology names
                  example: '["TensorFlow", "React", "FastAPI", "MongoDB"]'
                domain:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: Machine Learning
                department:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: Computer Science
                academicYear:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  example: "2025-26"
                teamMembers:
                  type: string
                  description: JSON array string of team member objects
                  example: '[{"name":"Jane Doe","role":"ML Engineer"},{"name":"Bob","role":"Frontend"}]'
                github:
                  type: string
                  description: JSON object string with url and access ('public' | 'protected')
                  example: '{"url":"https://github.com/nexora/crop-ai","access":"protected"}'
                deployedLink:
                  type: string
                  description: JSON object string with url and access ('public' | 'protected')
                  example: '{"url":"https://crop-ai.nexora.app","access":"public"}'
                screenshots:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Up to 5 screenshot images (JPEG, PNG, WEBP, max 5MB each)
                supportingDocument:
                  type: string
                  format: binary
                  description: Single supporting PDF document (max 5MB)
      responses:
        "201":
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                statusCode: 201
                success: true
                message: Project created successfully
                data:
                  _id: 67be04a2b3c4d5e6f7a8b9c3
                  title: AI-Driven Crop Disease Detection
                  summary: Deep learning platform for identifying plant leaf diseases in real-time.
                  domain: Machine Learning
                  department: Computer Science
                  academicYear: "2025-26"
                  isFeatured: false
                  technologies:
                    - TensorFlow
                    - React
