services:
  backend:
    image: nexora-backend:latest
    container_name: nexora-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production

    ports:
      - "4000:4000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: nexora-frontend:latest
    container_name: nexora-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"


